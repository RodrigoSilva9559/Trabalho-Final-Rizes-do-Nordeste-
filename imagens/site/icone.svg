<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Quadrado Arredondado -->
  <rect width="512" height="512" rx="110" fill="#d05714"/>
  
  <!-- Borda de Destaque -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#5a2b0f" stroke-width="20"/>

  <!-- Cacto Nordestino Minimalista -->
  <g fill="#ffd54f" stroke="#5a2b0f" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tronco Central -->
    <rect x="226" y="120" width="60" height="280" rx="30"/>
    
    <!-- Braço Esquerdo -->
    <path d="M 231 290 H 160 A 30 30 0 0 1 130 260 V 190 A 25 25 0 0 1 180 190 V 240 H 231 Z"/>
    
    <!-- Braço Direito -->
    <path d="M 281 250 H 352 A 30 30 0 0 0 382 220 V 150 A 25 25 0 0 0 332 150 V 200 H 281 Z"/>
    
    <!-- Base / Vasinho Simples -->
    <path d="M 176 400 L 196 440 H 316 L 336 400 Z" fill="#ffd54f"/>
  </g>
  
  <!-- Sol ao Fundo -->
  <circle cx="370" cy="110" r="35" fill="#ffffff" opacity="0.9"/>
</svg>
